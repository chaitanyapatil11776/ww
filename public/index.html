<!DOCTYPE html>
<html>
<head>
  <title>Google Imagen-4 Generator</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 60px;
      background: #f4f4f4;
    }

    input {
      padding: 12px;
      width: 300px;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      background: black;
      color: white;
      border: none;
      margin-left: 10px;
    }

    #loading {
      margin-top: 20px;
      font-weight: bold;
    }

    img {
      margin-top: 30px;
      max-width: 500px;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
      display: none;
    }
  </style>
</head>
<body>

  <h2>Google Imagen-4 Image Generator</h2>

  <input type="text" id="prompt" placeholder="Enter image prompt..." />
  <button onclick="generateImage()">Generate</button>

  <div id="loading"></div>
  <img id="result" />

  <script>
    async function generateImage() {
      const prompt = document.getElementById("prompt").value;
      const loading = document.getElementById("loading");
      const img = document.getElementById("result");

      if (!prompt) {
        alert("Enter a prompt first!");
        return;
      }

      loading.innerHTML = "Generating image... ⏳";
      img.style.display = "none";

      try {
        const response = await fetch("/generate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ prompt })
        });

        const data = await response.json();

        if (data.image) {
          img.src = data.image;
          img.style.display = "block";
          loading.innerHTML = "✅ Image Generated!";
        } else {
          loading.innerHTML = "";
          alert("Image generation failed");
        }

      } catch (error) {
        loading.innerHTML = "";
        alert("Server error");
      }
    }
  </script>

</body>
</html>
